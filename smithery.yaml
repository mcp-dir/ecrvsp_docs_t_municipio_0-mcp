name: ecrvsp_docs_t_municipio_0-mcp
displayName: "ECRVSP Documentos: Transferência de Município"
description: >
  ECRVSP Documentos: Transferência de Município, consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/ecrvsp_docs_t_municipio_0-mcp
repository: https://github.com/mcp-dir/ecrvsp_docs_t_municipio_0-mcp

tags:
  - ecrvsp_docs_t_municipio_0
  - brazil
