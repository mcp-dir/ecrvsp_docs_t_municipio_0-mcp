# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_ecrvsp_docs_t_municipio_0

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_ecrvsp_docs_t_municipio_0/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
